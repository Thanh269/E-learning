<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Admin - Quản lý tài khoản</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-5">

        <div class="card shadow-lg">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                <h4 class="mb-0">Quản Lý Tài Khoản</h4>
                <span id="tong-so-user" class="badge bg-warning text-dark"></span>
            </div>

            <div class="card-body">
                <table class="table table-bordered table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>STT</th>
                            <th>Email</th>
                            <th>Premium</th>
                            <th>Hành động</th>
                        </tr>
                    </thead>
                    <tbody id="bang-user">
                    </tbody>
                </table>

                <div class="text-end">
                    <button class="btn btn-danger" onclick="xoaTatCa()">
                        Xóa toàn bộ tài khoản
                    </button>
                </div>
            </div>
        </div>

    </div>

    <script src="admin.js"></script>
</body>

</html>
