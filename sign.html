<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eco Wellness Login</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="nature-background">
        <div class="floating-leaf leaf-1"></div>
        <div class="floating-leaf leaf-2"></div>
        <div class="floating-leaf leaf-3"></div>
        <div class="floating-leaf leaf-4"></div>
    </div>

    <div class="login-container">
        <div class="wellness-card">
            <div class="organic-border"></div>

            <div class="mindful-header">
                <div class="zen-logo">
                    <svg width="56" height="56" viewBox="0 0 56 56" fill="none">
                        <!-- Vòng ngoài -->
                        <circle cx="28" cy="28" r="26" stroke="currentColor" stroke-width="2" opacity="0.6" />
                        <circle cx="28" cy="28" r="18" stroke="currentColor" stroke-width="1.5" opacity="0.8" />

                        <!-- Cỏ 3 lá -->
                        <circle cx="28" cy="23" r="6" fill="currentColor" />
                        <circle cx="22" cy="31" r="6" fill="currentColor" />
                        <circle cx="34" cy="31" r="6" fill="currentColor" />

                        <!-- Cuống lá -->
                        <path d="M28 36c0 4-3 6-3 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                    </svg>
                    <div class="zen-glow"></div>
                </div>
                <h1>English for middle school</h1>
                <p>Học tiếng anh cùng Thành</p>
            </div>

            <form class="harmony-form" id="loginForm" novalidate>
                <div class="organic-field">
                    <div class="field-nature"></div>
                    <input type="email" id="email" name="email" required autocomplete="email">
                    <label for="email">Email Address</label>
                    <div class="growth-indicator">
                        <div class="leaf-sprout"></div>
                    </div>
                    <span class="gentle-error" id="emailError"></span>
                </div>

                <div class="organic-field">
                    <div class="field-nature"></div>
                    <input type="password" id="password" name="password" required> <label
                        for="password">Password</label>
                    <button type="button" class="nature-toggle" id="passwordToggle"
                        aria-label="Toggle password visibility">
                        <svg class="eye-visible" width="20" height="20" viewBox="0 0 20 20" fill="none">
                            <path
                                d="M10 4c-4 0-7 3-8 6 1 3 4 6 8 6s7-3 8-6c-1-3-4-6-8-6zm0 10a4 4 0 110-8 4 4 0 010 8zm0-6a2 2 0 100 4 2 2 0 000-4z"
                                fill="currentColor" />
                        </svg>
                        <svg class="eye-hidden" width="20" height="20" viewBox="0 0 20 20" fill="none">
                            <path
                                d="M3 3l14 14M8.5 8.5a2 2 0 002.83 2.83m-.83-4.83a4 4 0 014 4M10 6C6 6 3 9 2 12c.5 1.5 2 3.5 4 4.5M10 14c4 0 7-3 8-6-.5-1.5-2-3.5-4-4.5"
                                stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg>
                    </button>
                    <span class="gentle-error" id="passwordError"></span>
                </div>

                <div class="organic-field">
                    <div class="field-nature"></div>
                    <input type="password" id="confirmPassword" name="confirmPassword" required> <label
                        for="password">Re-enter password </label>
                    <button type="button" class="nature-toggle" id="passwordToggle2"
                        aria-label="Toggle password visibility">
                        <svg class="eye-visible" width="20" height="20" viewBox="0 0 20 20" fill="none">
                            <path
                                d="M10 4c-4 0-7 3-8 6 1 3 4 6 8 6s7-3 8-6c-1-3-4-6-8-6zm0 10a4 4 0 110-8 4 4 0 010 8zm0-6a2 2 0 100 4 2 2 0 000-4z"
                                fill="currentColor" />
                        </svg>
                        <svg class="eye-hidden" width="20" height="20" viewBox="0 0 20 20" fill="none">
                            <path
                                d="M3 3l14 14M8.5 8.5a2 2 0 002.83 2.83m-.83-4.83a4 4 0 014 4M10 6C6 6 3 9 2 12c.5 1.5 2 3.5 4 4.5M10 14c4 0 7-3 8-6-.5-1.5-2-3.5-4-4.5"
                                stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg>
                    </button>
                    <span class="gentle-error" id="passwordError"></span>
                </div>

                <div class="mindful-options">
                    <label class="zen-checkbox">
                        <input type="checkbox" id="remember" name="remember">
                        <span class="checkbox-leaf">
                            <svg width="10" height="8" viewBox="0 0 10 8" fill="none">
                                <path d="M1 4l2.5 2.5L9 1" stroke="currentColor" stroke-width="1.5"
                                    stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                        </span>
                        <a href="index.html" class="healing-link">Đăng nhập</a>
                    </label>
                    <a href="#" class="healing-link">Quên mật khẩu</a>
                </div>

                <button type="submit" class="harmony-button">
                    <div class="button-earth"></div>
                    <span class="button-text">Enter Sanctuary</span>
                    <div class="button-growth">
                        <div class="growing-circle circle-1"></div>
                        <div class="growing-circle circle-2"></div>
                        <div class="growing-circle circle-3"></div>
                    </div>
                    <div class="button-aura"></div>
                </button>
            </form>

            <div class="balance-divider">
                <div class="divider-branch"></div>
                <div class="divider-center">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <path d="M12 2L8 8h8l-4-6zM12 22l4-6H8l4 6zM2 12l6-4v8l-6-4zM22 12l-6 4V8l6 4z"
                            fill="currentColor" opacity="0.6" />
                    </svg>
                </div>
                <div class="divider-branch"></div>
            </div>
        </div>
    </div>

    <script src="../../shared/js/form-utils.js"></script>
    <script src="sign.js"></script>
    <script src="index.js"></script>
</body>

</html>
